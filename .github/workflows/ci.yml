name: CI
on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'ci/**'
      - 'issue/**'
      - 'master'
      - 'staging'
      - 'hotfix/**'
      - 'bug/**'
      - 'fix/**'
      - 'refactor/**'
      - 'build/**'
      - 'test/**'
      - 'dependabot/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: yarn install
      - run: yarn test --passWithNoTests

  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs:
      - test
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: tmh_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d tmh_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject Extracted Data
        run: |
          # We use psql on the host to reach the postgres service container via localhost:5432
          PGPASSWORD=admin psql -h localhost -U admin -d tmh_registry < plans/registry_db_export_20260104_192711.sql

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Registry API
        run: |
          docker run -d --name registry-api \
            --network host \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            -e DATABASE_URL=postgres://admin:admin@localhost:5432/tmh_registry \
            -e POSTGRES_USER=admin \
            -e POSTGRES_PASSWORD=admin \
            -e POSTGRES_DB=tmh_registry \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e DJANGO_DEBUG="true" \
            -e DJANGO_ALLOWED_HOSTS="localhost,127.0.0.1,0.0.0.0,*" \
            ghcr.io/swiftss-org/registry-api:main \
            /start

      - name: Get yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install

      - name: Wait for backend API
        run: |
          # Note: Since we use --network host, the API is listening on port 5000 directly
          timeout 60 bash -c 'until curl -f http://localhost:5000/admin; do sleep 2; done'

      - name: Build frontend
        run: yarn build
        env:
          CI: false
          REACT_APP_API_BASE_URL: http://localhost:5000

      - name: Serve frontend
        run: |
          npx serve -s build -l 3000 &
          sleep 5
        env:
          CI: false

      - name: Run Cypress tests
        run: yarn test:e2e
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_API_URL: http://localhost:5000

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

  deploy:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'
    needs:
      - test
      - e2e-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Release
        if: "github.event_name == 'push'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
