name: CI
on:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'ci/**'
      - 'issue/**'
      - 'master'
      - 'staging'
      - 'hotfix/**'
      - 'bug/**'
      - 'fix/**'
      - 'refactor/**'
      - 'build/**'
      - 'test/**'
      - 'dependabot/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - uses: actions/setup-node@v6
        with:
          node-version: '25'

      - run: yarn install
      - run: yarn test --passWithNoTests

  e2e-test:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs:
      - test
    
    services:
      registry-api:
        image: ghcr.io/swiftss-org/registry-api:main
        ports:
          - 8000:8000
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DATABASE_URL: sqlite:///db.sqlite3
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'

      - name: Install dependencies
        run: yarn install

      - name: Wait for backend API
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 2; done'

      - name: Build frontend
        run: yarn build
        env:
          CI: false

      - name: Serve frontend
        run: |
          npx serve -s build -l 3000 &
          sleep 5
        env:
          CI: false

      - name: Run Cypress tests
        run: yarn test:e2e
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos 📹
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7

  deploy:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'
    needs:
      - test
      - e2e-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Release
        if: "github.event_name == 'push'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
